<nav class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
  <div class="px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      
      <!-- Mobile menu button placeholder -->
      <div class="flex items-center md:hidden">
        <button type="button" class="text-gray-500 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-500 p-2 rounded-md">
          <span class="sr-only">Open sidebar</span>
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <!-- Left Side Placeholder (for alignment when sidebar is hidden) -->
      <div class="hidden md:flex"></div>
      
      <!-- Right Side Profile & Actions -->
      <div class="flex items-center gap-4">
        
        <!-- Search placeholder -->
        <div class="hidden lg:flex max-w-md w-full relative group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-4 w-4 text-gray-400 group-hover:text-primary-500 transition-colors" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input type="text" class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-all" placeholder="Search network...">
        </div>

        <div class="flex items-center gap-3 border-l border-gray-200 pl-4">
          <!-- Notification Button -->
          <button type="button" class="bg-white p-2 rounded-xl text-gray-400 hover:text-primary-600 hover:bg-primary-50 focus:outline-none transition-colors relative">
            <span class="sr-only">View notifications</span>
            <div class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></div>
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
          </button>

          <!-- Profile dropdown container -->
          <div class="relative" (click)="toggleUserMenu()" (blur)="isUserMenuOpen = false" tabindex="0">
            <button type="button" class="flex items-center gap-2 bg-white rounded-xl p-1 pr-2 hover:bg-gray-50 focus:outline-none transition-colors border border-transparent hover:border-gray-200" id="user-menu-button">
              <img class="h-8 w-8 rounded-lg object-cover bg-primary-100" 
                   [src]="'https://ui-avatars.com/api/?name=' + (currentUser?.name || 'U') + '&background=4f46e5&color=fff'" 
                   alt="User avatar">
              <span class="hidden md:block text-sm font-bold text-gray-700">
                {{ currentUser?.name || 'User' }}
              </span>
              <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Dropdown menu -->
            <div *ngIf="isUserMenuOpen" class="origin-top-right absolute right-0 mt-2 w-48 rounded-xl shadow-lg bg-white ring-1 ring-black ring-opacity-5 divide-y divide-gray-100 focus:outline-none" role="menu">
              <div class="px-4 py-3">
                <p class="text-sm">Signed in as</p>
                <p class="text-sm font-medium text-gray-900 truncate">{{ currentUser?.email || 'user@example.com' }}</p>
              </div>
              <div class="py-1">
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" role="menuitem">Your Profile</a>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" role="menuitem">Settings</a>
              </div>
              <div class="py-1">
                <button (click)="logout()" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 hover:font-semibold transition-colors" role="menuitem">
                  Sign out
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</nav>
