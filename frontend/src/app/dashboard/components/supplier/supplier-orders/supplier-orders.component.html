<div class="px-4 sm:px-6 lg:px-8 py-8">
  <div class="sm:flex sm:items-center">
    <div class="sm:flex-auto">
      <h1 class="text-xl font-extrabold text-gray-900 tracking-tight">Incoming Orders</h1>
      <p class="mt-2 text-sm text-gray-700 font-medium">Manage and fulfill your incoming consumer orders.</p>
    </div>
  </div>
  
  <div class="mt-8 flex flex-col">
    <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
    </div>

    <div *ngIf="!isLoading" class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="overflow-hidden shadow-xl shadow-gray-200/50 border border-gray-100 rounded-3xl">
          <table class="min-w-full divide-y divide-gray-100">
            <thead class="bg-gray-50/50">
              <tr>
                <th scope="col" class="py-4 pl-6 pr-3 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Order ID</th>
                <th scope="col" class="px-3 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Consumer</th>
                <th scope="col" class="px-3 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Date</th>
                <th scope="col" class="px-3 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Total</th>
                <th scope="col" class="px-3 py-4 text-left text-[10px] font-black text-gray-400 uppercase tracking-widest">Status</th>
                <th scope="col" class="px-3 py-4 text-right text-[10px] font-black text-gray-400 uppercase tracking-widest">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50 bg-white">
              <tr *ngFor="let order of orders" class="hover:bg-primary-50/20 transition-colors group">
                <td class="whitespace-nowrap py-5 pl-6 pr-3 text-sm font-bold text-gray-900">#{{ order.orderId }}</td>
                <td class="whitespace-nowrap px-3 py-5 text-sm">{{ order.consumer?.name || 'Unknown' }}</td>
                <td class="whitespace-nowrap px-3 py-5 text-sm">{{ order.orderDate }}</td>
                <td class="whitespace-nowrap px-3 py-5 text-sm font-bold">₹{{ order.totalAmount }}</td>
                <td class="whitespace-nowrap px-3 py-5 text-sm">
                  <span [ngClass]="{
                    'bg-yellow-100 text-yellow-800': order.status === 'PENDING',
                    'bg-green-100 text-green-800': order.status === 'DELIVERED'
                  }" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
                    {{ order.status }}
                  </span>
                </td>
                <td class="whitespace-nowrap px-3 py-5 text-right text-sm">
                  <button *ngIf="order.status === 'PENDING'" (click)="markAsDelivered(order)" class="text-primary-600 hover:text-primary-900 font-bold">
                    Mark Delivered
                  </button>
                </td>
              </tr>
              <tr *ngIf="orders.length === 0">
                <td colspan="6" class="py-12 text-center text-gray-400 italic font-medium">No orders found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
